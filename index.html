<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNBREAKABLE | Live Without Limits — Training, Nutrition, Mindset & Education</title>
    <meta name="description" content="The all-in-one fitness platform for training, nutrition, mindset and education. Build a body and mind that last — at 30, at 50, at 70. 7-day free trial." />
    <meta name="author" content="Live Without Limits LTD" />
    <meta name="theme-color" content="#080808" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UNBREAKABLE" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="UNBREAKABLE | Live Without Limits" />
    <meta property="og:description" content="The all-in-one fitness platform for training, nutrition, mindset and education. Build a body and mind that last. 7-day free trial." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.unbreakable-lwl.com" />
    <meta property="og:site_name" content="UNBREAKABLE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNBREAKABLE | Live Without Limits" />
    <meta name="twitter:description" content="The all-in-one fitness platform for training, nutrition, mindset and education. 7-day free trial." />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.unbreakable-lwl.com" />
  </head>

  <body style="background:#080808;color:#fff">
    <div id="root">
      <!-- Splash screen while React loads -->
      <div id="ub-splash" style="position:fixed;inset:0;z-index:9999;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;">
        <img src="/unbreakable-shield.png" alt="" width="80" height="80" style="animation:ub-pulse 1.5s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,85,0,0.4));" onerror="this.style.display='none'" />
        <p style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:0.2em;color:#FF5500;text-shadow:0 0 15px rgba(255,85,0,0.4);">KEEP SHOWING UP</p>
        <div style="width:48px;height:48px;border:2px solid #FF5500;border-top-color:transparent;border-radius:50%;animation:ub-spin 0.8s linear infinite;"></div>
        <style>
          @keyframes ub-spin { to { transform:rotate(360deg); } }
          @keyframes ub-pulse { 0%,100% { opacity:1;transform:scale(1); } 50% { opacity:0.7;transform:scale(0.95); } }
        </style>
      </div>
    </div>
    <script>
      // Remove splash once React renders
      const obs = new MutationObserver(() => {
        const splash = document.getElementById('ub-splash');
        if (splash && document.getElementById('root').children.length > 1) {
          splash.style.transition = 'opacity 0.3s';
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 300);
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
      // Fallback: remove after 5s regardless
      setTimeout(() => { const s = document.getElementById('ub-splash'); if (s) { s.style.opacity='0'; setTimeout(()=>s.remove(),300); } }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
