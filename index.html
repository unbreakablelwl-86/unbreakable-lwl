  <body style="background:#080808;color:#fff">
    <!-- Meta Pixel noscript fallback -->
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1488624762753788&ev=PageView&noscript=1" /></noscript>
    <div id="root">
      <!-- Pre-React splash — immediately visible while JS loads -->
      <div id="ub-splash" style="position:fixed;inset:0;z-index:9999;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
        <img src="/unbreakable-logo-clear.png" alt="UNBREAKABLE" width="200" style="opacity:0;animation:ub-fade-in 0.5s 0.3s forwards;object-fit:contain;" onerror="this.style.display='none'" />
        <p style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:0.2em;color:#FF5500;text-shadow:0 0 15px rgba(255,85,0,0.4);opacity:0;animation:ub-fade-in 0.5s 0.6s forwards;">KEEP SHOWING UP</p>
        <div style="width:40px;height:40px;border:2px solid #FF5500;border-top-color:transparent;border-radius:50%;animation:ub-spin 0.8s linear infinite;margin-top:8px;"></div>
        <style>
          @keyframes ub-spin { to { transform:rotate(360deg); } }
          @keyframes ub-fade-in { to { opacity:1; } }
        </style>
      </div>
    </div>
    <script>
      // Remove splash once React renders
      const obs = new MutationObserver(() => {
        const splash = document.getElementById('ub-splash');
        if (splash && document.getElementById('root').children.length > 1) {
          splash.style.transition = 'opacity 0.3s';
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 300);
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
      // Fallback: remove after 5s regardless
      setTimeout(() => { const s = document.getElementById('ub-splash'); if (s) { s.style.opacity='0'; setTimeout(()=>s.remove(),300); } }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
